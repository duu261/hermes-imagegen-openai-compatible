name: openai-compatible
version: 1.1.0
description: OpenAI Images-compatible Hermes backend for GPT-Image2 and trusted reverse proxies
author: Duu
kind: backend
provides_image_gen_providers:
  - openai-compatible
python_dependencies:
  - "openai>=2.0,<3"
requires_env:
  - name: OPENAI_COMPAT_IMAGE_BASE_URL
    description: "HTTPS base URL for the OpenAI-compatible image endpoint"
  - name: OPENAI_COMPAT_IMAGE_MODEL
    description: "Image model ID, normally gpt-image-2"
    optional: true
  - name: OPENAI_COMPAT_IMAGE_API_KEY
    description: "API key for the endpoint; optional for local unauthenticated servers"
    secret: true
    optional: true
