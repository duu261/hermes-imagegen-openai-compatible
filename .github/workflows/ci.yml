name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hermes Agent and plugin dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./hermes-agent "openai>=2.0,<3"

      - name: Unit tests
        working-directory: plugin
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Plugin doctor
        working-directory: plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins doctor . --ci

      - name: Catalog validation
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes plugins validate ./plugin
